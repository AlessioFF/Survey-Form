<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
<title> Survey Form </title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1 id="title"> Survey Form </h1>
  <p id="description"> Please fill out this form with the required information <p>
    <hr>
    <form id="survey-form" method="post" action='https://register-demo.freecodecamp.org'>
<fieldset>
  <label for="name" id="name-label">Name</label><input id="name" type="text" placeholder="Name"required></input>
  <label for="email" id="email-label">Email</label><input id="email" type="email" placeholder="Email"required></input>
  <label for="number" id="number-label">Age</label><input id="number" type="number" min="13"max="100" placeholder="Age"></input>
</fieldset>
<hr>
<fieldset>
<legend> Do you recommend freeCodeCamp to a friend?</legend>
  <label for="definitely"><input id="definitely" type="radio" name="recommendation" value="definitely" class="inline" > Definitely</label>
  <label for="maybe"><input id="maybe" type="radio" name="recommendation" value="maybe"  class="inline" > Maybe</label>
  <label for="not sure"><input id="not sure" type="radio" name="recommendation" value="not sure" class="inline" > Not Sure</label>
  </fieldset>
  <hr>
  <fieldset>
    <label for="dropdown" class="how"> How did you hear about us?</label>
    <select id="dropdown">
      <option value=""> Select one</option>
      <option value="1">YouTube Channel</option>
      <option value="2"> Facebook</option>
      <option value="3"> Instagram</option>
      <option value="4"> Other</option>
      </select>
  </fieldset>
  <hr>
  <fieldset>
    <legend> What would you like to see improved? (Check all the apply)</legend>
    <label for="Front-end Projects"><input id="Front-end Projects" type="checkbox" value="improvement" class="inline" > Front-end Projects</label>
    <label for="Data Visualization"><input id="Data Visualization" type="checkbox" value="improvement" class="inline" > Data Visualization</label>
    <label for="Back-end Projects"><input id="Back-end Projects" type="checkbox" value="improvement" class="inline" > Back-end Projects</label>
    <label for="Challenges"><input id="Challenges" type="checkbox" value="improvement" class="inline" > Challenges</label>
    <label for="Open Source Community"><input id="Open Source Community" type="checkbox" value="improvement" class="inline" > Open Source Community</label>
    <label for="City Meetups"><input id="City Meetups" type="checkbox" value="improvement" class="inline" > City Meetups</label>
    <label for="Forum"><input id="Forum" type="checkbox" value="improvement" class="inline" > Forum</label>
</fieldset>
<hr>
<fieldset>
  <label for="suggestions" class="any">Any suggestions?
  <textarea id="suggestions" type"text" rows="4" cols="20"placeholder="I suggest to..."></textarea>
  </label>
</fieldset>
<hr>
  <button type="submit" id="submit">Submit</button>
  </form>
</body>
</html>
